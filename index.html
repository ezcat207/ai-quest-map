<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Quest Map</title>
<style>
:root{--bg:#14122b;--card:#201d44;--card2:#2b2759;--ink:#f3f1ff;--mute:#a9a4d6;--a:#ffd166;--b:#06d6a0;--c:#4cc9f0;--d:#f78fb3;--boss:#ff5d5d;--line:#3a3570}
:root[data-pov="parent"]{--bg:#f6f4ee;--card:#fff;--card2:#efece2;--ink:#26231c;--mute:#6b665a;--a:#b7791f;--b:#2f855a;--c:#2b6cb0;--d:#b83280;--boss:#c53030;--line:#d9d4c3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
h1{margin:0;font-size:1.7rem}
.tog{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px}
button.on{background:var(--a);color:#1a1630;border-color:var(--a);font-weight:700}
.hero{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.xp{height:14px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:8px}
.xp>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--a));transition:width .4s}
.world{margin:26px 0 8px;display:flex;align-items:center;gap:10px}
.world h2{margin:0;font-size:1.25rem}
.world span{color:var(--mute);font-size:.9rem}
.path{position:relative;display:grid;gap:12px;padding-left:22px;border-left:4px dashed var(--line)}
.lvl{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;position:relative}
.lvl::before{content:"";position:absolute;left:-33px;top:18px;width:18px;height:18px;border-radius:50%;background:var(--wc);border:3px solid var(--bg)}
.lvl.done{border-color:var(--b)}
.lvl.done::before{background:var(--b)}
.lvl summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lvl summary::-webkit-details-marker{display:none}
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mute)}
.tag.new{background:var(--d);color:#fff}.tag.ready{background:var(--b);color:#fff}.tag.exp{background:var(--boss);color:#fff}
.id{font-weight:800;color:var(--wc)}
.title{font-weight:700;flex:1;min-width:150px}
.boss{margin-left:auto;color:var(--boss);font-weight:700;font-size:.9rem}
.body{margin-top:10px;display:grid;gap:8px}
.row{background:var(--card2);border-radius:10px;padding:8px 10px}
.row b{display:block;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.row.bossrow{border-left:5px solid var(--boss)}
label.def{display:flex;gap:8px;align-items:center;margin-top:4px;font-weight:700}
input[type=checkbox]{width:20px;height:20px}
.final{border:3px solid var(--boss);background:var(--card);border-radius:16px;padding:16px;margin:28px 0}
.note{font-size:.85rem;color:var(--mute);margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
.only-parent,.only-kid{display:none}
:root[data-pov="parent"] .only-parent{display:block}
:root[data-pov="kid"] .only-kid{display:block}
a{color:var(--c)}
@media(max-width:560px){h1{font-size:1.35rem}.boss{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 id="h1"></h1>
  <div class="tog">
    <button data-pov="kid" id="pk"></button><button data-pov="parent" id="pp"></button>
    <button data-lang="en">EN</button><button data-lang="zh">中文</button>
  </div>
</header>

<div class="hero">
  <div id="intro"></div>
  <div class="xp"><i id="xpbar"></i></div>
  <div id="xptext" style="margin-top:4px;color:var(--mute);font-size:.9rem"></div>
</div>

<div id="map"></div>

<div class="final">
  <h2 id="fh"></h2>
  <div id="fb"></div>
  <label class="def"><input type="checkbox" id="fc"> <span id="fl"></span></label>
</div>

<div class="note" id="note"></div>
</div>

const $=s=>document.querySelector(s);
function render(){
  const t=T[lang];
  document.documentElement.dataset.pov=pov;
  document.documentElement.lang=lang;
  $("#h1").textContent=t.h1; $("#pk").textContent=t.pk; $("#pp").textContent=t.pp;
  document.querySelectorAll("[data-pov]").forEach(b=>b.classList.toggle("on",b.dataset.pov===pov));
  document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
  $("#intro").innerHTML=t.intro[pov];
  let html="",cur="";
  U.forEach(u=>{
    if(u.w!==cur){cur=u.w;const W=WORLDS[u.w];
      if(html)html+="</div>";
      html+=`<div class="world" style="--wc:${W.c}"><h2 style="color:${W.c}">${W[lang]}</h2><span>${W.sub[lang]}</span></div><div class="path" style="--wc:${W.c}">`;}
    const c=u[lang],W=WORLDS[u.w],d=done[u.id];
    html+=`<details class="lvl ${d?"done":""}" style="--wc:${W.c}" ${u.pilot?"open":""}>
      <summary><span class="id">${u.id}</span><span class="title">${c.t}</span>
      ${u.pilot?`<span class="tag ready">${t.pilot}</span>`:""}
      <span class="tag ${u.st}">${t[u.st]}</span>
      <span class="boss">⚔ ${c.boss}</span></summary>
      <div class="body">
        <div class="only-kid"><div class="row"><b>${t.q}</b>${c.quest}</div>
          <div class="row"><b>${t.loot}</b>${c.loot}</div>
          <div class="row bossrow"><b>${t.boss}</b>${c.tip}</div></div>
        <div class="row"><b>${t.use}</b>${c.use}</div>
        <div class="only-parent"><div class="row"><b>${t.par}</b>${c.par}</div>
          <div class="row"><b>${t.pdo}</b>${c.do}</div>
          <div class="row"><b>${t.q}</b>${c.quest}</div></div>
        <label class="def"><input type="checkbox" data-id="${u.id}" ${d?"checked":""}> ${t.defeat}</label>
      </div></details>`;
  });
  $("#map").innerHTML=html+"</div>";
  const n=Object.keys(done).filter(k=>done[k]&&k!=="final").length;
  $("#xpbar").style.width=(100*(n+(done.final?1:0))/(U.length+1))+"%";
  $("#xptext").textContent=t.xp(n,U.length);
  $("#fh").textContent=t.fh;
  $("#fb").innerHTML=`<p>${t.fbk}</p><p class="only-parent" style="color:var(--mute)">${t.fbp}</p>`;
  $("#fl").textContent=t.fl; $("#fc").checked=!!done.final;
  $("#note").innerHTML=t.note;
  document.querySelectorAll("input[data-id]").forEach(i=>i.onchange=()=>{done[i.dataset.id]=i.checked;save();render()});
}
document.querySelectorAll("[data-pov]").forEach(b=>b.onclick=()=>{pov=b.dataset.pov;render()});
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});
$("#fc").onchange=e=>{done.final=e.target.checked;save();render()};
render();
</script>
</body>
</html>
